<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PayPal: Log in to your account</title>
<link rel="stylesheet" href="pages.css">
</head>
<body>
<p class="note">SafetyCatch TEST PAGE. It imitates a sign-in page of a well-known brand on the wrong address. The form goes nowhere: nothing you type is sent or stored.</p>
<div class="box">
<h1>Log in to PayPal</h1>
<form id="form" autocomplete="off">
<label>Email <input id="email" type="email" autocomplete="off"></label>
<label>Password <input id="password" type="password" autocomplete="off"></label>
<button type="submit">Log In</button>
</form>
<p id="status" role="status"></p>
</div>
<script src="lookalike-login.js"></script>
</body>
</html>
